<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>马克待办</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 48px;
            color: #222;
            margin-bottom: 32px;
        }
        .input-row {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
        }
        #todoInput {
            flex: 1;
            padding: 14px 16px;
            font-size: 20px;
            border: 1px solid #999;
            border-radius: 4px;
        }
        button {
            padding: 0 24px;
            font-size: 20px;
            border: 1px solid #999;
            background: #efefef;
            border-radius: 4px;
            cursor: pointer;
        }
        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid #eee;
        }
        .todo-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
        }
        .todo-left input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .todo-left .checked-text {
            color: #999;
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>阿福待办</h1>
        <div class="input-row">
            <input type="text" id="todoInput" placeholder="输入一个待办事项">
            <button id="addBtn">添加</button>
        </div>
        <div id="todoList">
            <div class="todo-item">
                <div class="todo-left">
                    <input type="checkbox">
                    <span>关注「阿福的技术工作坊」</span>
                </div>
                <button class="delBtn">删除</button>
            </div>
            <div class="todo-item">
                <div class="todo-left">
                    <input type="checkbox" checked>
                    <span class="checked-text">给这期 Git 教程点赞</span>
                </div>
                <button class="delBtn">删除</button>
            </div>
        </div>
    </div>

    <script>
        const todoInput = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');

        // 勾选切换样式
        function bindCheckbox(el) {
            el.addEventListener('change', function () {
                const textSpan = this.nextElementSibling;
                if(this.checked) {
                    textSpan.classList.add('checked-text');
                } else {
                    textSpan.classList.remove('checked-text');
                }
            })
        }
        // 删除事件
        function bindDelBtn(el) {
            el.addEventListener('click', function () {
                this.closest('.todo-item').remove();
            })
        }

        // 初始化已有待办的事件
        document.querySelectorAll('.todo-left input[type="checkbox"]').forEach(bindCheckbox);
        document.querySelectorAll('.delBtn').forEach(bindDelBtn);

        // 添加新待办
        addBtn.onclick = function () {
            const val = todoInput.value.trim();
            if(!val) return;
            const item = document.createElement('div');
            item.className = 'todo-item';
            item.innerHTML = `
                <div class="todo-left">
                    <input type="checkbox">
                    <span>${val}</span>
                </div>
                <button class="delBtn">删除</button>
            `
            todoList.appendChild(item);
            bindCheckbox(item.querySelector('input[type="checkbox"]'));
            bindDelBtn(item.querySelector('.delBtn'));
            todoInput.value = '';
        }
        // 回车添加
        todoInput.addEventListener('keydown', e=>{
            if(e.key === 'Enter') addBtn.click();
        })
    </script>
</body>
</html>
